<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 590" role="img" aria-labelledby="title desc">
  <title id="title">三段独立指数间隔叠加生成三阶 Erlang 样本</title>
  <desc id="desc">指数率参数为2，三个均匀数分别为0.5、0.8、0.25，逆变得到间隔0.3466、0.1116、0.6931。时间轴按长度比例连接，累计时刻0、0.3466、0.4581、1.1513。</desc>
  <rect width="1080" height="590" rx="22" fill="#f8fafc"/>
  <rect x="30" y="110" width="1020" height="426" rx="16" fill="#fff" stroke="#dce7ef"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif">
    <text x="45" y="51" font-size="27" font-weight="700" fill="#173a57">卷积法｜三次独立指数间隔相加，得到三阶 Erlang 等待时间</text>
    <text x="45" y="86" font-size="16" fill="#617b90">λ = 2　·　U = (0.5, 0.8, 0.25)　·　时间长度按计算结果比例绘制</text>
    <text x="64" y="153" font-size="19" font-weight="700" fill="#274f6c">等待第 3 次事件发生：Y = X₁ + X₂ + X₃</text>
  </g>
  <g>
    <rect x="145" y="227" width="173.29" height="91" rx="8" fill="#3473b2"/>
    <rect x="318.29" y="227" width="55.79" height="91" fill="#0d9388"/>
    <rect x="374.08" y="227" width="346.57" height="91" rx="8" fill="#8362b3"/>
    <path d="M318.29 227V318 M374.08 227V318" stroke="#ffffff" stroke-width="3"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#fff" font-weight="700">
    <text x="231.6" y="280">X₁</text>
    <text x="346.2" y="280" font-size="15">X₂</text>
    <text x="547.4" y="280">X₃</text>
  </g>
  <g stroke="#546d81" stroke-width="2.2">
    <path d="M145 342H760"/>
    <path d="M145 342V354 M318.29 342V354 M374.08 342V354 M720.65 342V354"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#405d74" text-anchor="middle">
    <text x="145" y="377">t=0</text>
    <text x="318.29" y="377">0.3466</text>
    <text x="374.08" y="402">0.4581</text>
    <text x="720.65" y="377">1.1513</text>
  </g>
  <g font-family="Arial, Microsoft YaHei, sans-serif" fill="#344f65" font-size="18">
    <text x="166" y="448">X₁ = −ln(0.5)/2 ≈ 0.3466</text>
    <text x="166" y="485">X₂ = −ln(0.8)/2 ≈ 0.1116</text>
    <text x="588" y="448">X₃ = −ln(0.25)/2 ≈ 0.6931</text>
    <text x="588" y="485" font-weight="700">Y = −ln(0.1)/2 ≈ 1.1513</text>
    <text x="66" y="568" font-size="16" fill="#668094">分布均值 E(Y)=3/2=1.5；单次样本 Y≈1.1513，两者不同。</text>
  </g>
</svg>
