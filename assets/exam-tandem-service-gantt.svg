<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc">
  <title id="title">四零件双机串联及运输时间线</title>
  <desc id="desc">M1 A0-2 B2-5 C5-6 D6-8；运输 A2-3 B5-6 C6-7 D8-9；M2 A3-5 B6-8 C8-11 D11-12。</desc>
  <rect width="1100" height="480" rx="18" fill="#fafcfe"/>
  <text x="42" y="40" fill="#17324c" font-family="Arial, sans-serif" font-size="24" font-weight="700">双机串联：加工 → 运输 → 加工</text>
  <text x="42" y="66" fill="#587285" font-family="Arial, sans-serif" font-size="14">水平长度严格对应时间；运输需要 1 个单位，空白区间为机器空闲</text>
  <g stroke="#e1eaf0" stroke-width="1">
