<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 472" role="img" aria-labelledby="title desc">
  <title id="title">六顾客共享队列的时间平均队长</title>
  <desc id="desc">时刻零到二队长为零，二到三为一，三到四为二，四到六为一，六到八为零。队长面积为五人分钟，除以八得到平均队长零点六二五。</desc>
  <rect width="1100" height="472" rx="22" fill="#f8fafc"/>
  <rect x="22" y="22" width="1056" height="428" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif">
    <text x="52" y="69" font-size="25" font-weight="700" fill="#172b4d">队长不是“数事件”，而是“算面积”</text>
    <text x="52" y="103" font-size="16" fill="#64748b">六顾客共享队列在 [0,8] 的变化；Q(t) 只统计等待者，不包含正在服务的顾客</text>
  </g>

  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="180" y1="195" x2="940" y2="195"/>
    <line x1="180" y1="280" x2="940" y2="280"/>
    <line x1="180" y1="365" x2="940" y2="365"/>
    <line x1="275" y1="135" x2="275" y2="365"/>
    <line x1="370" y1="135" x2="370" y2="365"/>
    <line x1="465" y1="135" x2="465" y2="365"/>
    <line x1="560" y1="135" x2="560" y2="365"/>
    <line x1="655" y1="135" x2="655" y2="365"/>
    <line x1="750" y1="135" x2="750" y2="365"/>
    <line x1="845" y1="135" x2="845" y2="365"/>
    <line x1="940" y1="135" x2="940" y2="365"/>
  </g>
  <path d="M180 135 V365 H970" fill="none" stroke="#475569" stroke-width="2.3" stroke-linecap="round"/>

  <!-- Filled rectangles are the area under the queue-length step function. -->
  <rect x="370" y="280" width="95" height="85" fill="#93c5fd" opacity="0.68"/>
  <rect x="465" y="195" width="95" height="170" fill="#60a5fa" opacity="0.45"/>
  <rect x="560" y="280" width="190" height="85" fill="#93c5fd" opacity="0.68"/>
  <path d="M180 365 H370 V280 H465 V195 H560 V280 H750 V365 H940" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <g font-family="Arial, Microsoft YaHei, sans-serif" fill="#334155" font-size="16">
    <text x="163" y="370" text-anchor="end">0</text>
    <text x="163" y="285" text-anchor="end">1</text>
    <text x="163" y="200" text-anchor="end">2</text>
    <text x="121" y="146" text-anchor="end">Q(t)</text>
    <text x="180" y="392" text-anchor="middle">0</text>
    <text x="275" y="392" text-anchor="middle">1</text>
    <text x="370" y="392" text-anchor="middle">2</text>
    <text x="465" y="392" text-anchor="middle">3</text>
    <text x="560" y="392" text-anchor="middle">4</text>
    <text x="655" y="392" text-anchor="middle">5</text>
    <text x="750" y="392" text-anchor="middle">6</text>
    <text x="845" y="392" text-anchor="middle">7</text>
    <text x="940" y="392" text-anchor="middle">8</text>
    <text x="974" y="392">t</text>
  </g>

  <g font-family="Arial, Microsoft YaHei, sans-serif" font-weight="700" text-anchor="middle">
    <text x="418" y="330" font-size="17" fill="#1e40af">1 × 1</text>
    <text x="512" y="272" font-size="17" fill="#1e40af">2 × 1</text>
    <text x="655" y="330" font-size="17" fill="#1e40af">1 × 2</text>
  </g>

  <rect x="52" y="410" width="995" height="30" rx="7" fill="#eff6ff"/>
  <text x="64" y="432" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">总面积 = 1×1 + 2×1 + 1×2 = 5 人·分钟　　时间平均队长 = 5 ÷ 8 = 0.625 人</text>
</svg>
