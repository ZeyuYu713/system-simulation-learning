<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 448" role="img" aria-labelledby="title desc">
  <title id="title">两台并行服务台的六顾客服务时间线</title>
  <desc id="desc">M1 依次服务顾客 1、3、6，区间为零到四、四到六、六到八；M2 在零到一空闲，随后依次服务顾客 2、4、5，区间为一到四、四到五、五到八。</desc>
  <rect width="1100" height="448" rx="22" fill="#f8fafc"/>
  <rect x="22" y="22" width="1056" height="404" rx="18" fill="white" stroke="#e2e8f0"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif">
    <text x="52" y="68" font-size="25" font-weight="700" fill="#172b4d">共享队列 · M1 优先：六顾客服务时间线</text>
    <text x="52" y="102" font-size="16" fill="#64748b">每个矩形表示一次服务活动；同一机器的服务区间不重叠</text>
  </g>

  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="178" y1="127" x2="178" y2="342"/>
    <line x1="274" y1="127" x2="274" y2="342"/>
    <line x1="370" y1="127" x2="370" y2="342"/>
    <line x1="466" y1="127" x2="466" y2="342"/>
    <line x1="562" y1="127" x2="562" y2="342"/>
    <line x1="658" y1="127" x2="658" y2="342"/>
    <line x1="754" y1="127" x2="754" y2="342"/>
    <line x1="850" y1="127" x2="850" y2="342"/>
    <line x1="946" y1="127" x2="946" y2="342"/>
  </g>

  <g font-family="Arial, Microsoft YaHei, sans-serif" fill="#334155">
    <text x="152" y="187" font-size="24" font-weight="700" text-anchor="end">M1</text>
    <text x="152" y="285" font-size="24" font-weight="700" text-anchor="end">M2</text>
    <text x="178" y="375" text-anchor="middle" font-size="15">0</text>
    <text x="274" y="375" text-anchor="middle" font-size="15">1</text>
    <text x="370" y="375" text-anchor="middle" font-size="15">2</text>
    <text x="466" y="375" text-anchor="middle" font-size="15">3</text>
    <text x="562" y="375" text-anchor="middle" font-size="15">4</text>
    <text x="658" y="375" text-anchor="middle" font-size="15">5</text>
    <text x="754" y="375" text-anchor="middle" font-size="15">6</text>
    <text x="850" y="375" text-anchor="middle" font-size="15">7</text>
    <text x="946" y="375" text-anchor="middle" font-size="15">8</text>
    <text x="1003" y="375" font-size="16">时间</text>
  </g>

  <rect x="178" y="146" width="384" height="68" rx="7" fill="#2563eb"/>
  <rect x="562" y="146" width="192" height="68" rx="7" fill="#3b82f6"/>
  <rect x="754" y="146" width="192" height="68" rx="7" fill="#1d4ed8"/>

  <rect x="178" y="246" width="96" height="68" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <rect x="274" y="246" width="288" height="68" rx="7" fill="#0d9488"/>
  <rect x="562" y="246" width="96" height="68" rx="7" fill="#14b8a6"/>
  <rect x="658" y="246" width="288" height="68" rx="7" fill="#0f766e"/>

  <g font-family="Arial, Microsoft YaHei, sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="white">
    <text x="370" y="188">顾客 1 · 4 分钟</text>
    <text x="658" y="188">顾客 3</text>
    <text x="850" y="188">顾客 6</text>
    <text x="418" y="288">顾客 2 · 3 分钟</text>
    <text x="610" y="288" font-size="15">顾客 4</text>
    <text x="802" y="288">顾客 5 · 3 分钟</text>
  </g>
  <text x="226" y="288" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" text-anchor="middle" fill="#64748b">空闲</text>

  <line x1="562" y1="128" x2="562" y2="329" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="7 6"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif">
    <text x="574" y="136" font-size="14" fill="#c2410c">时刻 4：两台同时完成并重新分配</text>
    <text x="52" y="407" font-size="15" fill="#64748b">到达时刻：0、1、2、3、4、5；顾客 3、4、5、6 发生了排队</text>
  </g>
</svg>
