<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">M1与M2等待队列长度阶梯图</title>
  <desc id="desc">M1队列在3、4、5、6、10、13发生变化，队长面积15；M2队列从14至20保持1，面积6；观察时长24。</desc>
  <rect width="1000" height="540" rx="20" fill="#f8fbfc"/>
  <text x="40" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17324c">两个队列的时间平均：看面积，不看事件次数</text>
  <text x="40" y="66" font-family="Arial, sans-serif" font-size="14" fill="#567386">阶梯高度是等待人数；每个水平段的面积 = 队长 × 持续时间</text>
  <g stroke="#e5edf1" stroke-width="1">
    <line x1="140" y1="112" x2="860" y2="112"/>
    <line x1="140" y1="172" x2="860" y2="172"/>
    <line x1="140" y1="232" x2="860" y2="232"/>
    <line x1="140" y1="303" x2="860" y2="303"/>
    <line x1="140" y1="363" x2="860" y2="363"/>
    <line x1="140" y1="423" x2="860" y2="423"/>
    <line x1="230" y1="112" x2="230" y2="423"/>
    <line x1="290" y1="112" x2="290" y2="423"/>
    <line x1="320" y1="112" x2="320" y2="423"/>
    <line x1="440" y1="112" x2="440" y2="423"/>
    <line x1="560" y1="112" x2="560" y2="423"/>
    <line x1="740" y1="112" x2="740" y2="423"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#315369" font-weight="700" font-size="17">
    <text x="50" y="171">M1 队列</text>
    <text x="50" y="373">M2 队列</text>
  </g>
  <path d="M140 232 H230 V172 H260 V112 H290 V172 H320 V112 H440 V172 H530 V232 H860 Z" fill="#ccefe9" opacity="0.72"/>
  <path d="M140 232 H230 V172 H260 V112 H290 V172 H320 V112 H440 V172 H530 V232 H860" fill="none" stroke="#0d9488" stroke-width="4" stroke-linejoin="round"/>
  <path d="M140 423 H560 V363 H740 V423 H860 Z" fill="#dbe7ff" opacity="0.85"/>
  <path d="M140 423 H560 V363 H740 V423 H860" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linejoin="round"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#4c6476" text-anchor="end">
    <text x="130" y="237">0</text><text x="130" y="177">1</text><text x="130" y="117">2</text>
    <text x="130" y="428">0</text><text x="130" y="368">1</text>
  </g>
  <g stroke="#667f90" stroke-width="1.5">
    <line x1="140" y1="232" x2="865" y2="232"/>
    <line x1="140" y1="423" x2="865" y2="423"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#4c6476" text-anchor="middle">
    <text x="140" y="449">0</text><text x="230" y="449">3</text><text x="290" y="449">5</text>
    <text x="320" y="449">6</text><text x="440" y="449">10</text><text x="560" y="449">14</text>
    <text x="740" y="449">20</text><text x="860" y="449">24</text>
  </g>
  <text x="500" y="477" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#315369">仿真时间 TNOW</text>
  <g font-family="Arial, sans-serif" font-size="15" font-weight="700">
    <rect x="628" y="121" width="210" height="51" rx="10" fill="#f1fbf8" stroke="#b9e4da"/>
    <text x="645" y="142" fill="#176c64">面积 = 15</text>
    <text x="645" y="161" fill="#176c64" font-size="13">平均队长 15/24 = 0.625</text>
    <rect x="628" y="309" width="210" height="48" rx="10" fill="#f3f7ff" stroke="#ccdcff"/>
    <text x="645" y="330" fill="#3159a8">面积 = 6</text>
    <text x="645" y="348" fill="#3159a8" font-size="13">平均队长 6/24 = 0.25</text>
  </g>
  <text x="500" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#698092">t=15 时 M2 队列的等待者由零件 3 换成零件 4，但队长仍为 1</text>
</svg>
