<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">四零件双机串联加工与运输时间线</title>
  <desc id="desc">零件1至4的M1加工、运输和M2加工区间，横轴从0到24。M1服务为0-5、5-10、10-13、13-14；M2为6-9、11-15、15-20、20-24。</desc>
  <rect width="1000" height="440" rx="20" fill="#f8fbfc"/>
  <text x="40" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17324c">四个零件的加工与运输时间线</text>
  <text x="40" y="65" font-family="Arial, sans-serif" font-size="14" fill="#567386">单机 M1 → 运输 1 → 单机 M2；每台机器 FCFS</text>
  <g stroke="#e2ebf0" stroke-width="1">
    <line x1="140" y1="96" x2="140" y2="354"/>
    <line x1="230" y1="96" x2="230" y2="354"/>
    <line x1="290" y1="96" x2="290" y2="354"/>
    <line x1="320" y1="96" x2="320" y2="354"/>
    <line x1="440" y1="96" x2="440" y2="354"/>
    <line x1="560" y1="96" x2="560" y2="354"/>
    <line x1="590" y1="96" x2="590" y2="354"/>
    <line x1="740" y1="96" x2="740" y2="354"/>
    <line x1="860" y1="96" x2="860" y2="354"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#315369">
    <text x="105" y="170" text-anchor="end">M1</text>
    <text x="105" y="250" text-anchor="end">运输</text>
    <text x="105" y="325" text-anchor="end">M2</text>
  </g>
  <g fill="#ffffff" stroke="#dce8ee" stroke-width="1.2">
    <rect x="140" y="140" width="720" height="52" rx="4"/>
    <rect x="140" y="227" width="720" height="30" rx="4"/>
    <rect x="140" y="296" width="720" height="52" rx="4"/>
  </g>
  <g stroke="#ffffff" stroke-width="2">
    <rect x="140" y="140" width="150" height="52" rx="4" fill="#3b82f6"/>
    <rect x="290" y="140" width="150" height="52" rx="4" fill="#0d9488"/>
    <rect x="440" y="140" width="90" height="52" rx="4" fill="#e6a43b"/>
    <rect x="530" y="140" width="30" height="52" rx="4" fill="#8b5cf6"/>
    <rect x="290" y="227" width="30" height="30" rx="3" fill="#3b82f6"/>
    <rect x="440" y="227" width="30" height="30" rx="3" fill="#0d9488"/>
    <rect x="530" y="227" width="30" height="30" rx="3" fill="#e6a43b"/>
    <rect x="560" y="227" width="30" height="30" rx="3" fill="#8b5cf6"/>
    <rect x="320" y="296" width="90" height="52" rx="4" fill="#3b82f6"/>
    <rect x="470" y="296" width="120" height="52" rx="4" fill="#0d9488"/>
    <rect x="590" y="296" width="150" height="52" rx="4" fill="#e6a43b"/>
    <rect x="740" y="296" width="120" height="52" rx="4" fill="#8b5cf6"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="215" y="171">1：0–5</text>
    <text x="365" y="171">2：5–10</text>
    <text x="485" y="171">3</text>
    <text x="545" y="171">4</text>
    <text x="365" y="328">1：6–9</text>
    <text x="530" y="328">2：11–15</text>
    <text x="665" y="328">3：15–20</text>
    <text x="800" y="328">4：20–24</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#4c6476" text-anchor="middle">
    <text x="140" y="115">0</text><text x="230" y="115">3</text><text x="290" y="115">5</text>
    <text x="320" y="115">6</text><text x="440" y="115">10</text><text x="560" y="115">14</text>
    <text x="590" y="115">15</text><text x="740" y="115">20</text><text x="860" y="115">24</text>
  </g>
  <text x="500" y="379" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#315369">仿真时间 TNOW</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#405d70">
    <rect x="186" y="399" width="14" height="14" rx="3" fill="#3b82f6"/><text x="207" y="411">零件 1</text>
    <rect x="318" y="399" width="14" height="14" rx="3" fill="#0d9488"/><text x="339" y="411">零件 2</text>
    <rect x="450" y="399" width="14" height="14" rx="3" fill="#e6a43b"/><text x="471" y="411">零件 3</text>
    <rect x="582" y="399" width="14" height="14" rx="3" fill="#8b5cf6"/><text x="603" y="411">零件 4</text>
  </g>
</svg>
