<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" role="img" aria-labelledby="title desc">
  <title id="title">四个均匀样本的 KS 检验经验分布函数</title>
  <desc id="desc">样本0.10、0.35、0.60、0.90；经验CDF在对应样本点由0上升到0.25、0.5、0.75和1。理论均匀CDF为F(x)=x。两个CDF的最大纵向距离是0.15，即KS统计量D=0.15。</desc>
  <rect width="1080" height="480" rx="18" fill="#f8fafc" />
  <text x="48" y="46" font-family="Arial, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#15334b">KS 检验：比较整条经验分布函数与理论分布</text>
  <text x="48" y="76" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" fill="#587187">四个排序样本：0.10、0.35、0.60、0.90；最大纵向差距 D = 0.15。</text>
  <g stroke="#dfe7ee" stroke-width="1">
    <line x1="155" y1="100" x2="805" y2="100" />
    <line x1="155" y1="165" x2="805" y2="165" />
    <line x1="155" y1="230" x2="805" y2="230" />
    <line x1="155" y1="295" x2="805" y2="295" />
    <line x1="155" y1="360" x2="805" y2="360" />
    <line x1="220" y1="100" x2="220" y2="360" stroke-dasharray="3 5" />
    <line x1="382.5" y1="100" x2="382.5" y2="360" stroke-dasharray="3 5" />
    <line x1="545" y1="100" x2="545" y2="360" stroke-dasharray="3 5" />
    <line x1="740" y1="100" x2="740" y2="360" stroke-dasharray="3 5" />
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#627c91" text-anchor="end">
    <text x="139" y="105">1.00</text>
    <text x="139" y="170">0.75</text>
    <text x="139" y="235">0.50</text>
    <text x="139" y="300">0.25</text>
    <text x="139" y="365">0</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#627c91" text-anchor="middle">
    <text x="155" y="384">0</text>
    <text x="220" y="384">0.10</text>
    <text x="382.5" y="384">0.35</text>
    <text x="545" y="384">0.60</text>
    <text x="740" y="384">0.90</text>
    <text x="805" y="384">1.00</text>
  </g>
  <line x1="155" y1="360" x2="805" y2="100" stroke="#0e9589" stroke-width="3.5" />
  <path d="M155 360 H220 V295 H382.5 V230 H545 V165 H740 V100 H805" fill="none" stroke="#3879d9" stroke-width="4" stroke-linejoin="round" />
  <g fill="#3879d9">
    <circle cx="220" cy="295" r="5" />
    <circle cx="382.5" cy="230" r="5" />
    <circle cx="545" cy="165" r="5" />
    <circle cx="740" cy="100" r="5" />
  </g>
  <g stroke="#de904d" stroke-width="5" stroke-linecap="round">
    <line x1="229" y1="295" x2="229" y2="334" />
    <line x1="731" y1="126" x2="731" y2="165" />
  </g>
  <g font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#b56b33">
    <text x="250" y="324">D⁺ = 0.15</text>
    <text x="638" y="143">D⁻ = 0.15</text>
  </g>
  <text x="155" y="93" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" fill="#627c91">累计概率 F(x)</text>
  <text x="814" y="384" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" fill="#627c91">样本值 x</text>
  <g font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" fill="#355366">
    <line x1="176" y1="422" x2="216" y2="422" stroke="#0e9589" stroke-width="3.5" />
    <text x="227" y="428">理论均匀分布 F(x) = x</text>
    <line x1="521" y1="422" x2="561" y2="422" stroke="#3879d9" stroke-width="4" />
    <text x="572" y="428">样本经验分布 Fₙ(x)</text>
  </g>
  <text x="172" y="456" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#627c91">阶梯跳变前后都可能达到最大距离，因此计算时必须分别检查 D⁺ 与 D⁻。</text>
</svg>
