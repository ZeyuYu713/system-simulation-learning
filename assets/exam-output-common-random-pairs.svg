<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 560" role="img" aria-labelledby="title desc">
  <title id="title">Paired common random numbers for comparing simulated systems A and B</title>
  <desc id="desc">Four paired outputs A 10,12,14,16 and B 9,11,14,15 give differences 1,1,0,1. Standard error of paired differences is 0.25, versus 1.8875 from the independent-sample formula which ignores their positive sample covariance of 7.</desc>
  <rect width="1140" height="560" rx="22" fill="#f6f8fb"/>
  <text x="48" y="55" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17324c">Common random numbers: compare paired differences</text>
  <text x="48" y="85" font-family="Arial, sans-serif" font-size="17" fill="#5c748c">Four matched random scenarios  |  sample covariance between A and B = +7</text>
  <rect x="33" y="109" width="635" height="403" rx="16" fill="#fff" stroke="#dce5ef"/>
  <rect x="688" y="109" width="417" height="403" rx="16" fill="#fff" stroke="#dce5ef"/>
  <text x="62" y="151" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#203d58">Same scenario: A and B close together</text>
  <g font-family="Arial, sans-serif" font-size="16" fill="#60788f"><text x="56" y="210">Pair 1</text><text x="56" y="278">Pair 2</text><text x="56" y="346">Pair 3</text><text x="56" y="414">Pair 4</text></g>
  <g stroke="#e5edf4" stroke-width="1.4"><line x1="172" y1="195" x2="636" y2="195"/><line x1="172" y1="263" x2="636" y2="263"/><line x1="172" y1="331" x2="636" y2="331"/><line x1="172" y1="399" x2="636" y2="399"/></g>
  <g stroke="#b6c9d9" stroke-width="5" stroke-linecap="round"><line x1="172" y1="195" x2="230" y2="195"/><line x1="288" y1="263" x2="346" y2="263"/><line x1="462" y1="331" x2="462" y2="331"/><line x1="520" y1="399" x2="578" y2="399"/></g>
  <g fill="#248b91" stroke="#fff" stroke-width="2"><circle cx="172" cy="195" r="9"/><circle cx="288" cy="263" r="9"/><circle cx="462" cy="331" r="9"/><circle cx="520" cy="399" r="9"/></g>
  <g fill="#dc855c" stroke="#fff" stroke-width="2"><circle cx="230" cy="195" r="9"/><circle cx="346" cy="263" r="9"/><circle cx="462" cy="331" r="5"/><circle cx="578" cy="399" r="9"/></g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#506b84" text-anchor="middle"><text x="172" y="467">9</text><text x="230" y="467">10</text><text x="288" y="467">11</text><text x="346" y="467">12</text><text x="404" y="467">13</text><text x="462" y="467">14</text><text x="520" y="467">15</text><text x="578" y="467">16</text></g>
  <g font-family="Arial, sans-serif" font-size="17" fill="#526d84"><circle cx="109" cy="488" r="6" fill="#248b91"/><text x="122" y="494">B</text><circle cx="182" cy="488" r="6" fill="#dc855c"/><text x="195" y="494">A</text><text x="320" y="494">paired differences: 1, 1, 0, 1</text></g>
  <text x="719" y="151" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#203d58">SE of difference in means</text>
  <line x1="742" y1="430" x2="1065" y2="430" stroke="#526c82" stroke-width="2"/>
  <rect x="773" y="402" width="104" height="28" rx="4" fill="#278c91"/>
  <rect x="936" y="219" width="104" height="211" rx="4" fill="#de895e"/>
  <text x="825" y="392" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#197b7f" text-anchor="middle">0.250</text>
  <text x="988" y="205" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#b76b47" text-anchor="middle">1.887</text>
  <g font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#536e85"><text x="825" y="460">Paired</text><text x="988" y="460">Unpaired</text><text x="825" y="481">differences</text><text x="988" y="481">formula</text></g>
  <text x="50" y="542" font-family="Arial, sans-serif" font-size="17" fill="#4e6882">Positive paired covariance reduces Var(A−B). The unpaired bar ignores the matching.</text>
</svg>
