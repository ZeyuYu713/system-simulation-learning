<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="650" viewBox="0 0 1160 650">
<rect x="0" y="0" width="1160" height="650" fill="#ffffff" />
<text x="55" y="53" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#1d3554" font-weight="bold">Three different statistical questions</text><text x="55" y="83" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#64748b" >An interval containing a null value is not the same as an interval contained by a practical tolerance</text><text x="55" y="185" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1d3554" font-weight="bold">1  One-sample 95% CI</text><text x="55" y="214" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b" >mu of simulated runs; H0: mu = 10</text><line x1="405" y1="202" x2="1058" y2="202" stroke="#b7c1ca" stroke-width="1.5" /><line x1="796.8" y1="158" x2="796.8" y2="246" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 4"/><line x1="472.3896" y1="202" x2="860.0104" y2="202" stroke="#b96433" stroke-width="5" /><line x1="472.3896" y1="191" x2="472.3896" y2="213" stroke="#b96433" stroke-width="3" /><line x1="860.0104" y1="191" x2="860.0104" y2="213" stroke="#b96433" stroke-width="3" /><circle cx="666.2" cy="202" r="6" fill="#1d3554" /><text x="472.3896" y="179" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b96433" text-anchor="middle">7.516</text><text x="860.0104" y="179" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b96433" text-anchor="middle">10.484</text><line x1="405" y1="229" x2="405" y2="238" stroke="#64748b" stroke-width="1" /><text x="405" y="257" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">7</text><line x1="535.6" y1="229" x2="535.6" y2="238" stroke="#64748b" stroke-width="1" /><text x="535.6" y="257" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">8</text><line x1="666.2" y1="229" x2="666.2" y2="238" stroke="#64748b" stroke-width="1" /><text x="666.2" y="257" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">9</text><line x1="796.8" y1="229" x2="796.8" y2="238" stroke="#64748b" stroke-width="1" /><text x="796.8" y="257" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">10</text><line x1="927.4" y1="229" x2="927.4" y2="238" stroke="#64748b" stroke-width="1" /><text x="927.4" y="257" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">11</text><line x1="1058" y1="229" x2="1058" y2="238" stroke="#64748b" stroke-width="1" /><text x="1058" y="257" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">12</text><text x="55" y="347" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1d3554" font-weight="bold">2  Paired-difference 95% CI</text><text x="55" y="376" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b" >mu_d = actual - simulation; H0: mu_d = 0</text><line x1="405" y1="364" x2="1058" y2="364" stroke="#b7c1ca" stroke-width="1.5" /><line x1="600.9" y1="320" x2="600.9" y2="408" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 4"/><line x1="739.4666" y1="364" x2="984.7334000000001" y2="364" stroke="#b96433" stroke-width="5" /><line x1="739.4666" y1="353" x2="739.4666" y2="375" stroke="#b96433" stroke-width="3" /><line x1="984.7334000000001" y1="353" x2="984.7334000000001" y2="375" stroke="#b96433" stroke-width="3" /><circle cx="862.0999999999999" cy="364" r="6" fill="#1d3554" /><text x="739.4666" y="341" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b96433" text-anchor="middle">1.061</text><text x="984.7334000000001" y="341" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b96433" text-anchor="middle">2.939</text><line x1="470.3" y1="391" x2="470.3" y2="400" stroke="#64748b" stroke-width="1" /><text x="470.3" y="419" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">-1</text><line x1="600.9" y1="391" x2="600.9" y2="400" stroke="#64748b" stroke-width="1" /><text x="600.9" y="419" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">0</text><line x1="731.5" y1="391" x2="731.5" y2="400" stroke="#64748b" stroke-width="1" /><text x="731.5" y="419" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">1</text><line x1="862.0999999999999" y1="391" x2="862.0999999999999" y2="400" stroke="#64748b" stroke-width="1" /><text x="862.0999999999999" y="419" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">2</text><line x1="992.7" y1="391" x2="992.7" y2="400" stroke="#64748b" stroke-width="1" /><text x="992.7" y="419" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">3</text><text x="55" y="509" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1d3554" font-weight="bold">3  Equivalence: 90% CI</text><text x="55" y="538" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b" >TOST, margin ±1 min; interval fully within tolerance</text><line x1="405" y1="526" x2="1058" y2="526" stroke="#b7c1ca" stroke-width="1.5" /><rect x="513.8333333333334" y="487" width="435.33333333333337" height="78" fill="#e0efed" stroke="#157b83" stroke-width="1" stroke-dasharray="4 4"/><line x1="731.5" y1="482" x2="731.5" y2="570" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 4"/><line x1="638.121" y1="526" x2="824.879" y2="526" stroke="#b96433" stroke-width="5" /><line x1="638.121" y1="515" x2="638.121" y2="537" stroke="#b96433" stroke-width="3" /><line x1="824.879" y1="515" x2="824.879" y2="537" stroke="#b96433" stroke-width="3" /><circle cx="731.5" cy="526" r="6" fill="#1d3554" /><text x="638.121" y="503" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b96433" text-anchor="middle">-0.429</text><text x="824.879" y="503" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b96433" text-anchor="middle">0.429</text><line x1="405" y1="553" x2="405" y2="562" stroke="#64748b" stroke-width="1" /><text x="405" y="581" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">-1.5</text><line x1="513.8333333333334" y1="553" x2="513.8333333333334" y2="562" stroke="#64748b" stroke-width="1" /><text x="513.8333333333334" y="581" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">-1</text><line x1="731.5" y1="553" x2="731.5" y2="562" stroke="#64748b" stroke-width="1" /><text x="731.5" y="581" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">0</text><line x1="949.1666666666667" y1="553" x2="949.1666666666667" y2="562" stroke="#64748b" stroke-width="1" /><text x="949.1666666666667" y="581" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">1</text><line x1="1058" y1="553" x2="1058" y2="562" stroke="#64748b" stroke-width="1" /><text x="1058" y="581" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">1.5</text><rect x="58" y="615" width="18" height="14" fill="#e0efed" stroke="#157b83"/><text x="84" y="627" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1d3554" >Preset acceptable range [-1, +1] (third row only)</text>
</svg>
