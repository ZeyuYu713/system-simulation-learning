<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">Tri(2,5,10) 三角分布逆变法的分段累计概率结果图</title>
  <desc id="desc">精确使用 F(x)=(x-2)²/24 (2到5)，F(x)=1-(10-x)²/40 (5到10)。分界 F(5)=0.375。u=0.25 对应 x=2+根号6约4.449，u=0.75 对应 x=10-根号10约6.838。</desc>
  <rect width="1100" height="650" rx="22" fill="#f8fafc"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif">
    <text x="48" y="53" fill="#123452" font-size="27" font-weight="700">三角分布逆变法｜先求分段阈值，再读出样本值</text>
    <text x="48" y="85" fill="#597086" font-size="16">Tri(a=2, m=5, b=10)　·　F(m)=(m−a)/(b−a)=0.375</text>
  </g>
  <rect x="38" y="113" width="840" height="485" rx="16" fill="#ffffff" stroke="#e1e9f0"/>
  <g stroke="#e6edf2" stroke-width="1">
    <path d="M190 415H870 M190 330H870 M190 245H870 M190 160H870"/>
    <path d="M275 160V500 M360 160V500 M445 160V500 M530 160V500 M615 160V500 M700 160V500 M785 160V500"/>
  </g>
  <path d="M190 149V500H879" fill="none" stroke="#596f81" stroke-width="2.2" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif" font-size="15" fill="#5f7182">
    <text x="160" y="505">0</text><text x="146" y="420">0.25</text><text x="146" y="335">0.50</text><text x="146" y="250">0.75</text><text x="146" y="165">1.00</text>
    <text x="185" y="527">2</text><text x="355" y="527">4</text><text x="439" y="527">5</text><text x="610" y="527">7</text><text x="865" y="527">10</text>
    <text x="142" y="140">F(x)</text><text x="879" y="520">x</text>
  </g>
  <polyline points="190,500 232.5,496.5 275,485.8 317.5,468.1 360,443.3 402.5,411.5 445,372.5 487.5,332.1 530,296 572.5,264.1 615,236.5 657.5,213.1 700,194 742.5,179.1 785,168.5 827.5,162.1 870,160" fill="none" stroke="#2361ae" stroke-width="4.3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="none" stroke-width="2.5" stroke-dasharray="8 6">
    <path d="M190 415H398.21V500" stroke="#df5360"/>
    <path d="M190 372.5H445V500" stroke="#c18b2b"/>
    <path d="M190 245H601.21V500" stroke="#0e8f89"/>
  </g>
  <g stroke="#ffffff" stroke-width="2.5">
    <circle cx="398.21" cy="415" r="6.7" fill="#df5360"/>
    <circle cx="445" cy="372.5" r="6.7" fill="#c18b2b"/>
    <circle cx="601.21" cy="245" r="6.7" fill="#0e8f89"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="700">
    <text x="392" y="547" text-anchor="middle" fill="#c64453">4.449</text>
    <text x="445" y="564" text-anchor="middle" fill="#b48224">m=5</text>
    <text x="602" y="547" text-anchor="middle" fill="#067e77">6.838</text>
  </g>
  <rect x="900" y="143" width="177" height="343" rx="14" fill="#eff5f9" stroke="#dae6ed"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif" fill="#25445d">
    <text x="922" y="183" font-size="18" font-weight="700">三次反函数读取</text>
    <circle cx="925" cy="224" r="5.5" fill="#df5360"/>
    <text x="940" y="229" font-size="16">u=0.25</text>
    <text x="922" y="257" font-size="16">x≈4.449</text>
    <circle cx="925" cy="301" r="5.5" fill="#c18b2b"/>
    <text x="940" y="306" font-size="16">u=0.375</text>
    <text x="922" y="334" font-size="16">x=5</text>
    <circle cx="925" cy="376" r="5.5" fill="#0e8f89"/>
    <text x="940" y="382" font-size="16">u=0.75</text>
    <text x="922" y="409" font-size="16">x≈6.838</text>
    <text x="922" y="452" font-size="13" fill="#6c8294">分界是 0.375</text>
    <text x="922" y="473" font-size="13" fill="#6c8294">不是固定 0.5</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#647889">
    <text x="64" y="626">2 ≤ x &lt; 5:  F(x)=(x−2)²/24　　　　 5 ≤ x ≤ 10:  F(x)=1−(10−x)²/40</text>
  </g>
</svg>
